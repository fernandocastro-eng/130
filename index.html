<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Compañeros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <form id="registroForm">
            <h2>Registro de Datos de Compañeros</h2>

            <div class="input-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" placeholder="Ej. Mareily Jackson" required>
            </div>

            <div class="input-group">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" placeholder="correo@ejemplo.com" required>
            </div>

            <div class="input-group">
                <label for="foto">Fotografía:</label>
                <input type="file" id="foto" accept="image/*">
            </div>

            <button type="submit" id="btnGuardar">Guardar Datos</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
